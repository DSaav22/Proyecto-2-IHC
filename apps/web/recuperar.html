<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar contraseña · Planazo</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/estilos.css">
</head>
<body>
  <main class="form-pag">
    <div class="caja">
      <h1>Recuperar contraseña</h1>

      <form id="pedir">
        <div class="aviso" id="aviso1" hidden></div>
        <label for="correo">Correo electrónico</label>
        <input id="correo" type="email" autocomplete="email">
        <p class="error" id="err-correo" hidden></p>
        <button class="boton" id="btn1">Solicitar token</button>
      </form>

      <form id="cambiar" hidden>
        <p class="ok" id="mensaje" hidden></p>
        <div class="token" id="caja-token" hidden>
          Tu token de recuperación:
          <code id="token-visto"></code>
        </div>
        <div class="aviso" id="aviso2" hidden></div>
        <label for="token">Token</label>
        <input id="token" type="text">
        <p class="error" id="err-token" hidden></p>
        <label for="nueva">Nueva contraseña (mínimo 8 caracteres)</label>
        <input id="nueva" type="password" autocomplete="new-password">
        <p class="error" id="err-nueva" hidden></p>
        <button class="boton" id="btn2">Cambiar contraseña</button>
      </form>

      <p class="ok" id="listo" hidden>Tu contraseña se actualizó correctamente.</p>
      <p class="links"><a href="/login">Volver a iniciar sesión</a></p>
    </div>
  </main>
  <script src="/comun.js"></script>
  <script>
    var correoUsado = "";

    document.getElementById("pedir").onsubmit = async function (e) {
      e.preventDefault();
      var correo = document.getElementById("correo").value;
      mostrar("err-correo", "");
      mostrar("aviso1", "");
      if (!correoValido(correo)) {
        mostrar("err-correo", "Ingresa un correo válido.");
        return;
      }

      var boton = document.getElementById("btn1");
      boton.disabled = true;
      boton.textContent = "Solicitando…";
      var res = await pedir("/api/auth/recover", { correo: correo.trim() });
      boton.disabled = false;
      boton.textContent = "Solicitar token";

      if (!res.ok) {
        mostrar("aviso1", res.json.message || "No se pudo solicitar el token.");
        return;
      }

      correoUsado = correo.trim();
      document.getElementById("pedir").hidden = true;
      document.getElementById("cambiar").hidden = false;
      if (res.json.token) {
        document.getElementById("token-visto").textContent = res.json.token;
        document.getElementById("caja-token").hidden = false;
        document.getElementById("token").value = res.json.token;
      } else {
        mostrar("mensaje", res.json.message);
      }
    };

    document.getElementById("cambiar").onsubmit = async function (e) {
      e.preventDefault();
      var token = document.getElementById("token").value.trim();
      var nueva = document.getElementById("nueva").value;
      mostrar("err-token", "");
      mostrar("err-nueva", "");
      mostrar("aviso2", "");

      if (!token) mostrar("err-token", "Ingresa el token.");
      if (nueva.length < 8) mostrar("err-nueva", "La contraseña debe tener al menos 8 caracteres.");
      if (!token || nueva.length < 8) return;

      var boton = document.getElementById("btn2");
      boton.disabled = true;
      boton.textContent = "Cambiando…";
      var res = await pedir("/api/auth/recover/confirm", {
        correo: correoUsado,
        token: token,
        clave: nueva
      });
      if (!res.ok) {
        mostrar("aviso2", res.json.message || "No se pudo cambiar la contraseña.");
        boton.disabled = false;
        boton.textContent = "Cambiar contraseña";
        return;
      }
      document.getElementById("cambiar").hidden = true;
      document.getElementById("listo").hidden = false;
    };
  </script>
</body>
</html>
