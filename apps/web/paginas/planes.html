<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis planes · Planazo</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <p class="centro" id="cargando">Cargando…</p>
  <main class="form-pag" id="contenido" hidden>
    <div>
      <div class="barra">
        <h1 id="saludo">Hola</h1>
        <button class="boton-linea" type="button" id="salir">Cerrar sesión</button>
      </div>
      <div class="caja caja-ancha">
        <h2 id="titulo-form">Nuevo plan</h2>
        <form id="nuevo">
          <label for="nombre">Nombre</label>
          <input id="nombre" type="text" placeholder="Cena del viernes">
          <label for="fecha">Fecha límite</label>
          <input id="fecha" type="text" placeholder="5 de octubre">
          <p class="error" id="err-plan" hidden></p>
          <button class="boton" id="btn-crear">Crear plan</button>
          <button class="boton-linea" type="button" id="btn-dejar" hidden style="margin-top:10px">Dejar de editar</button>
        </form>
      </div>
      <div class="caja caja-ancha" style="margin-top:16px">
        <h2>Tus planes</h2>
        <label for="busca">Buscar</label>
        <input id="busca" type="text" placeholder="Nombre del plan">
        <label for="filtro">Estado</label>
        <select id="filtro">
          <option value="">Todos</option>
          <option value="borrador">Borrador</option>
          <option value="confirmado">Confirmado</option>
          <option value="cancelado">Cancelado</option>
        </select>
        <p class="vacio" id="vacio">Todavía no hay ninguno.</p>
        <p class="vacio" id="nada" hidden>Ninguno coincide.</p>
        <div id="lista"></div>
      </div>
    </div>
  </main>
  <script src="/js/comun.js"></script>
  <script>
    var todos = [];
    var editando = null;
    var ultimo = null;

    pedir("/api/auth/me").then(function (res) {
      if (!res.ok) {
        location.replace("/login");
        return;
      }
      document.getElementById("saludo").textContent = "Hola, " + res.json.user.nombre;
      document.getElementById("cargando").hidden = true;
      document.getElementById("contenido").hidden = false;
      cargarPlanes();
    });

    async function cargarPlanes() {
      var res = await pedir("/api/planes");
      todos = res.json.planes || [];
      mostrarLista();
    }

    function mostrarLista() {
      var lista = document.getElementById("lista");
      var vacio = document.getElementById("vacio");
      var nada = document.getElementById("nada");
      var q = document.getElementById("busca").value.trim().toLowerCase();
      var filtro = document.getElementById("filtro").value;
      lista.innerHTML = "";

      var planes = [];
      for (var i = 0; i < todos.length; i++) {
        var item = todos[i];
        if (filtro && item.estado !== filtro) continue;
        if (q && item.nombre.toLowerCase().indexOf(q) === -1) continue;
        planes.push(item);
      }

      vacio.hidden = todos.length > 0;
      nada.hidden = todos.length === 0 || planes.length > 0;

      for (var j = 0; j < planes.length; j++) {
        var plan = planes[j];
        var div = document.createElement("div");
        div.className = "plan";
        var estado = plan.estado;
        if (estado === "borrador") estado = "Borrador";
        if (estado === "confirmado") estado = "Confirmado";
        if (estado === "cancelado") estado = "Cancelado";

        var texto = document.createElement("p");
        texto.textContent = plan.nombre + " · " + plan.fecha_limite + " · " + estado;
        div.appendChild(texto);

        if (plan.estado === "borrador") {
          var boton = document.createElement("button");
          boton.className = "boton-linea";
          boton.type = "button";
          boton.textContent = "Confirmar plan";
          boton.style.marginRight = "8px";
          boton.onclick = function () {
            confirmar(this.getAttribute("data-id"));
          };
          boton.setAttribute("data-id", plan.id);
          div.appendChild(boton);
        }

        if (plan.estado === "borrador" || plan.estado === "confirmado") {
          var botonEditar = document.createElement("button");
          botonEditar.className = "boton-linea";
          botonEditar.type = "button";
          botonEditar.textContent = "Editar";
          botonEditar.style.marginRight = "8px";
          botonEditar.onclick = function () {
            empezarEdicion(this.getAttribute("data-id"));
          };
          botonEditar.setAttribute("data-id", plan.id);
          div.appendChild(botonEditar);

          var botonCancelar = document.createElement("button");
          botonCancelar.className = "boton-linea";
          botonCancelar.type = "button";
          botonCancelar.textContent = "Cancelar plan";
          botonCancelar.onclick = function () {
            cancelar(this.getAttribute("data-id"));
          };
          botonCancelar.setAttribute("data-id", plan.id);
          div.appendChild(botonCancelar);
        }

        if (plan.estado === "cancelado") {
          var nota = document.createElement("p");
          nota.className = "nota";
          nota.textContent = "Ya está cancelado. No se puede confirmar ni cancelar otra vez.";
          div.appendChild(nota);
        }

        if (String(plan.id) === ultimo) {
          var aviso = document.createElement("p");
          aviso.className = "ok";
          aviso.textContent = plan.nombre + " quedó cancelado.";
          div.appendChild(aviso);
        }

        lista.appendChild(div);
      }
    }

    document.getElementById("busca").oninput = function () {
      mostrarLista();
    };

    document.getElementById("filtro").onchange = function () {
      mostrarLista();
    };

    function empezarEdicion(id) {
      var plan = null;
      for (var i = 0; i < todos.length; i++) {
        if (String(todos[i].id) === String(id)) plan = todos[i];
      }
      if (!plan) return;
      editando = plan.id;
      document.getElementById("titulo-form").textContent = "Editar plan";
      document.getElementById("nombre").value = plan.nombre;
      document.getElementById("fecha").value = plan.fecha_limite;
      document.getElementById("btn-crear").textContent = "Guardar cambios";
      document.getElementById("btn-dejar").hidden = false;
      mostrar("err-plan", "");
      document.getElementById("nombre").focus();
    }

    function dejarEdicion() {
      editando = null;
      document.getElementById("titulo-form").textContent = "Nuevo plan";
      document.getElementById("nombre").value = "";
      document.getElementById("fecha").value = "";
      document.getElementById("btn-crear").textContent = "Crear plan";
      document.getElementById("btn-dejar").hidden = true;
      mostrar("err-plan", "");
    }

    document.getElementById("btn-dejar").onclick = function () {
      dejarEdicion();
    };

    document.getElementById("nuevo").onsubmit = async function (e) {
      e.preventDefault();
      var nombre = document.getElementById("nombre").value.trim();
      var fecha = document.getElementById("fecha").value.trim();
      mostrar("err-plan", "");
      if (!nombre || !fecha) {
        mostrar("err-plan", "Escribe el nombre y la fecha.");
        return;
      }
      var boton = document.getElementById("btn-crear");
      boton.disabled = true;
      var res;
      if (editando) {
        res = await pedir("/api/planes/actualizar", { id: editando, nombre: nombre, fecha: fecha });
      } else {
        res = await pedir("/api/planes", { nombre: nombre, fecha: fecha });
      }
      boton.disabled = false;
      if (!res.ok) {
        mostrar("err-plan", res.json.message || "No se pudo guardar.");
        return;
      }
      dejarEdicion();
      cargarPlanes();
    };

    async function confirmar(id) {
      var res = await pedir("/api/planes/confirmar", { id: id });
      if (!res.ok) {
        mostrar("err-plan", res.json.message || "No se pudo confirmar.");
        return;
      }
      cargarPlanes();
    }

    async function cancelar(id) {
      if (!window.confirm("¿Cancelar este plan?")) {
        return;
      }
      var res = await pedir("/api/planes/cancelar", { id: id });
      if (!res.ok) {
        mostrar("err-plan", res.json.message || "No se pudo cancelar.");
        return;
      }
      mostrar("err-plan", "");
      ultimo = String(id);
      cargarPlanes();
    }

    document.getElementById("salir").onclick = async function () {
      this.disabled = true;
      this.textContent = "Cerrando…";
      await pedir("/api/auth/logout", {});
      location.replace("/login");
    };
  </script>
</body>
</html>
